name: Build signed Android app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create temporary release signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/kids-video-release.jks" \
            -storepass "CartoonBuild2026!" \
            -keypass "CartoonBuild2026!" \
            -alias kids-video \
            -keyalg RSA -keysize 3072 -validity 3650 \
            -dname "CN=Kids AI Video Creator, OU=CI, O=CartoonUploaderAI, L=Georgetown, C=GY"

      - name: Build signed release APK and AAB
        shell: bash
        run: |
          gradle clean :app:assembleRelease :app:bundleRelease \
            -PsigningStoreFile="$RUNNER_TEMP/kids-video-release.jks" \
            -PsigningStorePassword="CartoonBuild2026!" \
            -PsigningKeyAlias="kids-video" \
            -PsigningKeyPassword="CartoonBuild2026!" \
            --stacktrace

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kids-AI-Video-Creator-signed
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
